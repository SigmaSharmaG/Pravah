version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: pravah
      POSTGRES_PASSWORD: pravah123
      POSTGRES_DB: pravah_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pravah -d pravah_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://pravah:pravah123@db:5432/pravah_db
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-this}
      OSRM_URL: http://router.project-osrm.org
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app   # for development hot-reload (optional)
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data: